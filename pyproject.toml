[project]
name = "discord-webhook-mcp"
version = "0.1.1"
description = "MCP server for posting to Discord via webhooks"
readme = "README.md"
authors = [
    { name = "andrew", email = "the.fanatic.explorer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.3.1",
    "httpx>=0.28.1",
]

[project.scripts]
discord-webhook-mcp = "discord_webhook_mcp:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
